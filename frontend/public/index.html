<!doctype html>
<html lang="id">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#7c5cff" />
        <meta name="description" content="My Lil Famz — tugas seru, reward nyata, keluarga bahagia." />

        <!-- PWA -->
        <link rel="manifest" href="/manifest.json" />
        <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" />
        <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="My Lil Famz" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <!-- Core fonts only, and non-blocking: text paints immediately in the
             system font and swaps when these arrive. Theme-only fonts (Baloo 2,
             Orbitron) are loaded on demand by src/lib/fonts.js. -->
        <link
            rel="preload"
            as="style"
            href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=Manrope:wght@500;600;700;800&display=swap"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=Manrope:wght@500;600;700;800&display=swap"
            rel="stylesheet"
            media="print"
            onload="this.media='all'"
        />
        <noscript>
            <link
                href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=Manrope:wght@500;600;700;800&display=swap"
                rel="stylesheet"
            />
        </noscript>

        <title>My Lil Famz — tugas seru untuk keluarga</title>
        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
    </head>
    <body>
        <noscript>Kamu perlu mengaktifkan JavaScript untuk menjalankan aplikasi ini.</noscript>
        <div id="root"></div>
    </body>
</html>
